[workspace]
members = ["crates/bootlite-core", "crates/bootlite-cli", "crates/bootlite-gui"]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
eframe = "0.29"
flate2 = "1.0"
indicatif = "0.17"
libc = "0.2"
plist = "1.7"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
