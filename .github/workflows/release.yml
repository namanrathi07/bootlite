name: Build & Release Multi-OS Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    name: Build macOS (Apple Silicon .dmg)
    runs-on: macos-15-intel
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Rust Target (aarch64-apple-darwin)
        run: |
          rustup update stable --no-self-update
          rustup target add aarch64-apple-darwin

      - name: Build macOS .app & .dmg
        run: ./scripts/bundle-macos.sh

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v7
        with:
          name: asset-macos
          path: dist/BootLite-macOS-AppleSilicon.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows (x86_64 Portable .exe & CLI)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Build Windows Release Binaries
        run: |
          cargo build --release --workspace
          mkdir dist
          Copy-Item target\release\bootlite-gui.exe dist\BootLite-Windows-x86_64-Portable.exe
          Copy-Item target\release\bootlite-cli.exe dist\bootlite-cli-Windows-x86_64.exe

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: asset-windows
          path: |
            dist/BootLite-Windows-x86_64-Portable.exe
            dist/bootlite-cli-Windows-x86_64.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux (x86_64 .tar.gz)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Linux GUI System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgtk-3-dev

      - name: Build Linux Release Tarball
        run: |
          cargo build --release --workspace
          mkdir -p dist/bootlite-linux
          cp target/release/bootlite-gui dist/bootlite-linux/
          cp target/release/bootlite-cli dist/bootlite-linux/
          cp README.md LICENSE dist/bootlite-linux/ 2>/dev/null || true
          tar -czf dist/BootLite-Linux-x86_64.tar.gz -C dist/bootlite-linux .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v7
        with:
          name: asset-linux
          path: dist/BootLite-Linux-x86_64.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release & Checksums
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Download All Built Artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd release-assets
          sha256sum BootLite-macOS-AppleSilicon.dmg \
                    BootLite-Windows-x86_64-Portable.exe \
                    bootlite-cli-Windows-x86_64.exe \
                    BootLite-Linux-x86_64.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "BootLite $TAG" \
              --generate-notes
          fi
