name: Build & Release (macOS, Linux, Windows)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            release_file: dist/BootLite-macOS-AppleSilicon.dmg
            gen_notes: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            release_file: BootLite-Windows-x86_64-Portable.exe
            gen_notes: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            release_file: BootLite-Linux-x86_64.tar.gz
            gen_notes: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build macOS .app & .dmg Installer
        if: matrix.os == 'macos-latest'
        run: ./scripts/bundle-macos.sh ${{ matrix.target }}

      - name: Build Windows Standalone Portable .exe
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cargo build --release --target ${{ matrix.target }}
          Copy-Item "target/${{ matrix.target }}/release/bootlite-gui.exe" -Destination "${{ matrix.release_file }}"

      - name: Build Linux App Package
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo build --release --target ${{ matrix.target }}
          cd target/${{ matrix.target }}/release
          mv bootlite-gui BootLite
          tar -czvf ../../../${{ matrix.release_file }} BootLite bootlite-cli

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-package
          path: ${{ matrix.release_file }}

      - name: Publish to GitHub Releases (on Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.release_file }}
          generate_release_notes: ${{ matrix.gen_notes }}
